<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Test - IndiaBIX Clone</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="top-bar">
    <button class="hamburger" id="hamburger">&#9776;</button>
    <h1 class="logo-title">IndiaBIX</h1>

    <div class="search-bar">
        <input type="search" id="searchInput" placeholder="Search topics...">
        <button id="searchBtn">Search</button>
    </div>

    <div class="action-buttons">
      <button id="shareButton">Share</button>
      <button id="darkModeToggle">Mode</button>
      <a href="profile.html"><button>Profile</button></a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <h2 id="testTitle">Loading...</h2>
    <p id="breadcrumbs">Home >> Online Tests >> <span id="testBreadcrumb"></span></p>

    <!-- Timer -->
    <div id="timer" class="timer">Time Left: 00:00</div>

    <!-- Questions Section -->
    <div id="testQuestions" class="questions-container"></div>

    <!-- Submit Section -->
    <div class="submit-section">
      <button id="submitBtn" class="submit-btn">Submit Test</button>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© IndiaBIX Technologies</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="../js/main.js"></script>
  <script src="../js/online-test-questions.js"></script>
</body>
</html>
